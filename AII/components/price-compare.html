<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>요금 비교 가로 막대 그래프 (컴포넌트 미리보기)</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="price-compare.css">
<style>
  body{ margin:0; background:#f6f8fa; }
</style>
</head>
<body>

<!-- ===================== 요금 비교 (가로 막대 그래프) ===================== -->
<!-- 나중에 다른 페이지(예: 스마트폰 페이지)에 넣을 때는
     이 <section> 통째로 복사 + price-compare.css/js 링크만 추가하면 됨.
     텍스트/가격/퍼센트(--pct)만 그 페이지 상품에 맞게 바꾸면 됨. -->
<section class="price-compare">
  <div class="price-compare__inner">
    <p class="price-compare__eyebrow">PRICE COMPARE</p>
    <h2 class="price-compare__title">500M 기준, 월 납부요금 비교</h2>
    <p class="price-compare__desc">같은 속도 기준으로 통신사별 월 요금을 비교해보세요.</p>

    <div class="price-compare__card">
      <p class="price-compare__unit">단위: 원/월 · 통신사 약정 조건 기준</p>

      <div class="price-compare__bars" id="priceCompareBars">
        <div class="price-compare__row">
          <p class="price-compare__name">A통신사</p>
          <div class="price-compare__track">
            <div class="price-compare__fill" style="--pct:95%"></div>
          </div>
          <p class="price-compare__price">28,500원</p>
        </div>

        <div class="price-compare__row">
          <p class="price-compare__name">B통신사</p>
          <div class="price-compare__track">
            <div class="price-compare__fill" style="--pct:83.3%"></div>
          </div>
          <p class="price-compare__price">25,000원</p>
        </div>

        <div class="price-compare__row price-compare__row--featured">
          <p class="price-compare__name">싹딜 추천</p>
          <div class="price-compare__track">
            <div class="price-compare__fill price-compare__fill--featured" style="--pct:73.3%"></div>
          </div>
          <p class="price-compare__price">22,000원 <span class="price-compare__badge">혜택지원금</span></p>
        </div>
      </div>
    </div>

    <p class="price-compare__caption">※ 위 비교 수치는 디자인 시안용 예시이며, 실제 상담 시 최신 조건을 확인해야 합니다.</p>
  </div>
</section>

<script src="price-compare.js"></script>
</body>
</html>
